name: Call Reusable

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/call-reusable.yml'

jobs:
  build:
    uses: FacundoBarberoORT/lab-github-actions-t03/.github/workflows/reusable-build.yml@develop
    with:
      image-name: mi-aplicacion
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
